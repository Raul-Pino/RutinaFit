<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Catálogo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background-color: #f4f4f4; }
        
        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        header button { background: #dc3545; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 3px; }

        /* FORMULARIO CREAR */
        .form-inline { display: flex; gap: 10px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { padding: 10px; flex: 1; border: 1px solid #ddd; border-radius: 4px; }
        .btn-create { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        /* TABLA */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 5px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f1f1f1; }

        /* BOTONES TABLA */
        .btn-mini { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; color: white; margin-right: 5px; }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-delete { background: #dc3545; }

        /* MODAL */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
        .modal { background: white; padding: 25px; width: 400px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal h3 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .modal label { display: block; margin-top: 10px; font-weight: bold; }
        .modal input { width: 100%; box-sizing: border-box; margin-top: 5px; }
        .modal-actions { margin-top: 20px; text-align: right; }
        .btn-save { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Gestión de Catálogo (Admin)</h1>
    <button onclick="logout()">Cerrar Sesión</button>
</header>

<div class="form-inline">
    <input type="number" id="newCodigo" placeholder="Cód (1=Fuerza...)" required min="1" max="10" style="flex: 0.5;">
    <input type="text" id="newNombre" placeholder="Nombre (ej: Press Banca)" required>
    <input type="text" id="newDesc" placeholder="Descripción (ej: Pecho, Barra)" required>
    <button class="btn-create" onclick="crearInfo()">+ Añadir</button>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Cód</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th style="width: 150px;">Acciones</th>
        </tr>
    </thead>
    <tbody id="tbodyInfo"></tbody>
</table>

<div id="modalEdit" class="modal-overlay">
    <div class="modal">
        <h3>Editar Ejercicio</h3>
        <input type="hidden" id="editId">
        
        <label>Código:</label>
        <input type="number" id="editCodigo" min="1" max="10">
        
        <label>Nombre:</label>
        <input type="text" id="editNombre">
        
        <label>Descripción:</label>
        <input type="text" id="editDesc">
        
        <div class="modal-actions">
            <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
            <button class="btn-save" onclick="guardarEdicion()">Guardar Cambios</button>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://localhost:8443/ejercicios-info';
    const token = localStorage.getItem('token');

    // Verificar si hay token
    if (!token) window.location.href = 'index.html';

    // --- CARGAR DATOS ---
    async function cargarCatalogo() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.getElementById('tbodyInfo');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                const safeNombre = item.nombre.replace(/"/g, '&quot;');
                const safeDesc = (item.descripcion || '').replace(/"/g, '&quot;');

                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.codigo}</td>
                        <td>${item.nombre}</td>
                        <td>${item.descripcion || ''}</td>
                        <td>
                            <button class="btn-mini btn-edit" onclick="abrirEditar(${item.id}, ${item.codigo}, '${safeNombre}', '${safeDesc}')">Editar</button>
                            <button class="btn-mini btn-delete" onclick="borrarInfo(${item.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error("Error cargando catálogo", e);
        }
    }

    // --- CREAR ---
    async function crearInfo() {
        const item = {
            codigo: document.getElementById('newCodigo').value,
            nombre: document.getElementById('newNombre').value,
            descripcion: document.getElementById('newDesc').value
        };

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token 
            },
            body: JSON.stringify(item)
        });

        if (res.ok) {
            // Limpiar inputs
            document.getElementById('newCodigo').value = '';
            document.getElementById('newNombre').value = '';
            document.getElementById('newDesc').value = '';
            cargarCatalogo();
        } else {
            alert("Error: Solo Admins pueden crear o datos inválidos.");
        }
    }

    // --- EDITAR ---
    function abrirEditar(id, codigo, nombre, descripcion) {
        document.getElementById('editId').value = id;
        document.getElementById('editCodigo').value = codigo;
        document.getElementById('editNombre').value = nombre;
        document.getElementById('editDesc').value = descripcion;
        
        document.getElementById('modalEdit').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('modalEdit').style.display = 'none';
    }

    async function guardarEdicion() {
        const id = document.getElementById('editId').value;
        const item = {
            codigo: document.getElementById('editCodigo').value,
            nombre: document.getElementById('editNombre').value,
            descripcion: document.getElementById('editDesc').value
        };

        const res = await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token 
            },
            body: JSON.stringify(item)
        });

        if (res.ok) {
            cerrarModal();
            cargarCatalogo();
        } else {
            alert("Error al actualizar. Verifique permisos o datos.");
        }
    }

    // --- BORRAR ---
    async function borrarInfo(id) {
        if(!confirm("¿Seguro que quieres eliminar este ejercicio del catálogo?")) return;
        
        const res = await fetch(`${API_URL}/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.ok) cargarCatalogo();
        else alert("Error: No autorizado.");
    }

    (function() {
            const token = localStorage.getItem('token');

            // 1. Si no hay token, mandar al Login
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            try {
                // 2. Decodificar el JWT para leer el rol
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const payload = JSON.parse(jsonPayload);

                // 3. VERIFICACIÓN: Si no es ADMIN redirigimos
                if (payload.rol !== 'ADMIN') {
                    alert("Acceso Denegado: Esta zona es solo para Administradores.");
                    window.location.href = 'app.html';
                }
                
            } catch (e) {
                // Si el token es inválido
                console.error("Token inválido", e);
                localStorage.clear();
                window.location.href = 'index.html';
            }
        })();

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }

    cargarCatalogo();
</script>

</body>
</html>
