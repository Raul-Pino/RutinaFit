<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RutinaFit - Laboratorio Social V2</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        h3 { color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 10px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #1765d1; }
        .btn-danger { background: #d93025; }
        .btn-danger:hover { background: #b92118; }
        .status { padding: 10px; border-radius: 6px; font-size: 0.9em; margin-top: 10px; min-height: 20px; }
        .error { background: #fce8e6; color: #d93025; }
        .success { background: #e6f4ea; color: #1e8e3e; }
        ul { list-style: none; padding: 0; }
        li { background: #f8f9fa; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #1a73e8; }
    </style>
</head>
<body>

    <div class="card">
        <h3>1. Autenticación</h3>
        <input type="text" id="email" placeholder="Usuario" value="usuario@correo.com">
        <input type="password" id="password" placeholder="Password" value="123456">
        <button onclick="login()">Loguearse (HTTP 8080)</button>
        <div id="auth-status" class="status">Estado: Desconectado</div>
    </div>

    <div class="card">
        <h3>2. Enviar Solicitud (DTO)</h3>
        <input type="number" id="destId" placeholder="ID del destinatario">
        <select id="tipoSol">
            <option value="AMISTAD">Amistad</option>
            <option value="ENTRENAMIENTO">Entrenamiento</option>
        </select>
        <button onclick="enviarSol()">Enviar Petición</button>
        <div id="social-status" class="status"></div>
    </div>

    <div class="card">
        <h3>3. Bandeja de Entrada</h3>
        <button onclick="cargarPendientes()" style="background: #34a853;">Refrescar Pendientes</button>
        <ul id="lista-pendientes"></ul>
    </div>

    <div class="card">
        <h3>4. Romper Relaciones</h3>
        <p style="font-size: 0.8em; color: #666;">Introduce el ID de la <b>Amistad</b> o del <b>Alumno</b>:</p>
        <input type="number" id="relacionId" placeholder="ID Amistad / ID Alumno">
        
        <button class="btn-danger" onclick="romperAmistad()">Eliminar Amistad</button>
        <button class="btn-danger" onclick="quitarEntrenador()" style="margin-top: 4px;">Quitar Entrenador/Alumno</button>
        
        <div id="rel-status" class="status"></div>
    </div>

        <div class="card">
        <h3>5. Mis Amigos</h3>
        <button onclick="cargarAmigos()" style="background: #4285f4;">Ver Lista de Amigos</button>
        <ul id="lista-amigos"></ul>
    </div>

    <div class="card">
        <h3>6. Mis Alumnos</h3>
        <button onclick="cargarAlumnos()" style="background: #f4b400; color: black;">Ver Lista de Alumnos</button>
        <ul id="lista-alumnos"></ul>
    </div>

    <div class="card">
        <h3>7. Buscador de Usuarios</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="inputBusqueda" placeholder="Escribe un username..." style="flex-grow: 1;">
            <button onclick="buscarUsuarios()" style="background: #007bff;">Buscar</button>
        </div>
        
        <div id="resultados-busqueda" style="border-top: 1px solid #eee; padding-top: 10px;">
            <p style="color: #666; font-size: 0.9em;">Los resultados aparecerán aquí...</p>
        </div>
    </div>

    <script>
        let token = "";
        const API_URL = "http://localhost:8080";

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const status = document.getElementById('auth-status');
            try {
                const resp = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    token = data.token;
                    status.className = "status success";
                    status.innerText = "✅ Conectado";
                } else {
                    status.className = "status error";
                    status.innerText = "❌ Error en credenciales";
                }
            } catch (e) {
                status.className = "status error";
                status.innerText = "🔥 Servidor caído o error CORS";
            }
        }

        function enviarSol() {
            const destId = document.getElementById('destId').value;
            const tipo = document.getElementById('tipoSol').value;
            enviarSolicitud(destId, tipo)
        }
        
        async function enviarSolicitud(destId, tipo) {
            const status = document.getElementById('social-status');

            try {
                const resp = await fetch(`${API_URL}/solicitudes/enviar`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ destinatarioId: parseInt(destId), tipo: tipo })
                });
                const msg = await resp.text();
                status.className = resp.ok ? "status success" : "status error";
                status.innerText = resp.ok ? "✅ " + msg : "❌ " + msg;
            } catch (e) { status.innerText = "🔥 Error de conexión"; }
        }

        async function cargarPendientes() {
            const lista = document.getElementById('lista-pendientes');
            try {
                const resp = await fetch(`${API_URL}/solicitudes/pendientes`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const solicitudes = await resp.json();
                lista.innerHTML = "";
                solicitudes.forEach(s => {
                    lista.innerHTML += `<li>
                        <b>De:</b> ${s.remitente.username} (${s.tipo})<br>
                        <button onclick="gestionar(${s.id}, 'aceptar')" style="width:48%; background:green;">Aceptar</button>
                        <button onclick="gestionar(${s.id}, 'rechazar')" style="width:48%; background:red;">Rechazar</button>
                    </li>`;
                });
            } catch (e) { alert("Error al cargar pendientes"); }
        }

        async function gestionar(id, accion) {
            await fetch(`${API_URL}/solicitudes/${id}/${accion}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            cargarPendientes();
        }

        // --- FUNCIONES PARA ROMPER RELACIONES ---

        async function romperAmistad() {
            const id = document.getElementById('relacionId').value;
            const status = document.getElementById('rel-status');
            try {
                const resp = await fetch(`${API_URL}/amistades/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                status.className = resp.ok ? "status success" : "status error";
                status.innerText = resp.ok ? "✅ Amistad eliminada y solicitud borrada" : "❌ Error al borrar";
            } catch (e) { status.innerText = "🔥 Error de red"; }
        }

        async function quitarEntrenador() {
            const alumnoId = document.getElementById('relacionId').value;
            const status = document.getElementById('rel-status');

            try {
                const resp = await fetch(`${API_URL}/usuarios/entrenador/quitar/${alumnoId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                status.className = resp.ok ? "status success" : "status error";
                status.innerText = resp.ok ? "✅ Vínculo roto y solicitud borrada" : "❌ No tienes permiso";
            } catch (e) { status.innerText = "🔥 Error de red"; }
        }

        async function cargarAmigos() {
            const lista = document.getElementById('lista-amigos');
            try {
                const resp = await fetch(`${API_URL}/amistades`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if(!resp.ok) throw new Error("Error al obtener amigos");
                
                const amistades = await resp.json();
                lista.innerHTML = "";
                
                if (amistades.length === 0) {
                    lista.innerHTML = "<li>No tienes amigos aún 😢</li>";
                    return;
                }
                console.log(amistades);
                amistades.forEach(a => {
                    // Lógica para saber cuál de los dos usuarios eres tú y mostrar al "otro"
                    // Nota: Esto asume que el objeto Usuario tiene el campo 'username'
                    lista.innerHTML += `<li>
                        <b>ID Relación: ${a.id}</b><br>
                        Amigo: ${a.username}<br>
                        <small>Usa el ID ${a.id} para eliminarla</small>
                    </li>`;
                });
            } catch (e) { 
                alert("Error: " + e.message); 
            }
        }

        async function cargarAlumnos() {
            const lista = document.getElementById('lista-alumnos');
            try {
                const resp = await fetch(`${API_URL}/usuarios/alumnos`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!resp.ok) throw new Error("Error al obtener alumnos o no eres entrenador");
                
                const alumnos = await resp.json();
                lista.innerHTML = "";
                
                if (alumnos.length === 0) {
                    lista.innerHTML = "<li>No tienes alumnos asignados todavía.</li>";
                    return;
                }

                alumnos.forEach(alumno => {
                    // Aquí mostramos el ID del alumno para que puedas usarlo en "Romper Relaciones"
                    lista.innerHTML += `<li>
                        <b>ID Alumno: ${alumno.id}</b><br>
                        Nombre: ${alumno.username}<br>
                        <small>Usa el ID ${alumno.id} para desvincularlo</small>
                    </li>`;
                });
            } catch (e) { 
                alert("Error: " + e.message); 
            }
        }

        async function buscarUsuarios() {
            const nombre = document.getElementById('inputBusqueda').value;
            const listaResultados = document.getElementById('resultados-busqueda');
            
            const resp = await fetch(`${API_URL}/usuarios/buscar?username=${nombre}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (resp.ok) {
                const usuarios = await resp.json();
                listaResultados.innerHTML = "";

                usuarios.forEach(u => {
                    // Mostramos el nombre, pero el botón envía el ID
                    listaResultados.innerHTML += `
                    <li>
                        ${u.username} ${u.esEntrenador ? '(Entrenador)' : ''}
                        <button onclick="enviarSolicitud(${u.id}, 'AMISTAD')">Añadir</button>
                        </li>`;
                    });  
                }
        }

    </script>
</body>
</html>
