<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Entrenamiento + Edición</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* HEADER */
        header { background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        header button { margin-left: 10px; cursor: pointer; padding: 5px 10px; border: none; border-radius: 4px; }
        .btn-profile { background: #007bff; color: white; }
        .btn-logout { background: #666; color: white; }

        /* LAYOUT PRINCIPAL */
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .col { flex: 1; border-right: 1px solid #ccc; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .col:last-child { border-right: none; }
        .col h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #555; }
        
        /* CARDS */
        .card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; position: relative; padding-right: 80px; /* Espacio para botones */ }
        .card:hover { background: #eef; border-color: #007bff; }
        .card.active { background: #e0f0ff; border-color: #0056b3; border-left: 5px solid #0056b3; }
        
        /* BOTONES DE ACCIÓN */
        .btn-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .btn-mini { border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; color: white; font-size: 12px; }
        .btn-delete { background: #dc3545; }
        .btn-edit { background: #ffc107; color: #333; }
        
        .btn-add { background: #28a745; color: white; width: 100%; padding: 10px; border: none; margin-bottom: 20px; cursor: pointer; }
        
        .form-box { background: #eee; padding: 15px; margin-bottom: 20px; border-radius: 5px; display: none; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .disabled-overlay { text-align: center; color: #999; margin-top: 50px; }

        /* MODALES (Perfil y Edición) */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: white; padding: 20px; width: 400px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .modal h3 { margin-top: 0; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        .token-box { background: #333; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; word-break: break-all; max-height: 100px; overflow-y: auto; border-radius: 4px; margin-bottom: 10px; }
        .btn-primary { background: #007bff; color: white; width: 100%; border: none; padding: 10px; cursor: pointer; margin-top: 10px; border-radius: 5px;}
        .close-modal { float: right; cursor: pointer; font-size: 20px; font-weight: bold; color: #999; }
        
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h3>Mi Gym Tracker</h3>
    <div>
        <span id="headerUsername">Cargando...</span>
        <a id="btn-admin" href="./admin.html" class="btn-primary" style="text-decoration: none; display: none;">Zona administración</a>
        <button class="btn-profile" onclick="abrirPerfil()">Mi Perfil</button>
        <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
</header>

<div class="main-container">

    <div class="col" id="colRutinas">
        <h2>1. Mis Rutinas</h2>
        <button class="btn-add" onclick="toggleForm('formRutina')">+ Nueva Rutina</button>
        <div id="formRutina" class="form-box">
            <input id="newRutinaNombre" placeholder="Nombre (ej: Hipertrofia)">
            <input id="newRutinaDesc" placeholder="Descripción">
            <button class="btn-primary" onclick="crearRutina()">Guardar</button>
        </div>
        <div id="listaRutinas"></div>
    </div>

    <div class="col" id="colSesiones">
        <h2>2. Sesiones</h2>
        <div id="sesionesContent" style="display:none;">
            <button class="btn-add" onclick="toggleForm('formSesion')">+ Nueva Sesión</button>
            <div id="formSesion" class="form-box">
                <input type="date" id="newSesionFecha">
                <button class="btn-primary" onclick="crearSesion()">Guardar</button>
            </div>
            <div id="listaSesiones"></div>
        </div>
        <div id="sesionesMsg" class="disabled-overlay">Selecciona una rutina</div>
    </div>

    <div class="col" id="colEjercicios">
        <h2>3. Ejercicios</h2>
        <div id="ejerciciosContent" style="display:none;">
            <button class="btn-add" onclick="toggleForm('formEjercicio')">+ Añadir Serie</button>
            <div id="formEjercicio" class="form-box">
                <label>Ejercicio:</label>
                <select id="selectCatalogo"></select>
                <input type="number" id="param1" placeholder="Param 1 (Peso/Distancia)">
                <input type="number" id="param2" placeholder="Param 2 (Reps/Minutos)">
                <button class="btn-primary" onclick="crearEjercicio()">Guardar</button>
            </div>
            <div id="listaEjercicios"></div>
        </div>
        <div id="ejerciciosMsg" class="disabled-overlay">Selecciona una sesión</div>
    </div>

    <div id="modalPerfil" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="cerrarModal('modalPerfil')">&times;</span>
            <h3>Mi Perfil</h3>
            <label>Usuario:</label> <input type="text" id="profileUsername">
            <label>Email:</label> <input type="email" id="profileEmail">
            <button class="btn-primary" onclick="actualizarPerfil()">Actualizar Datos</button>
            <hr>
            <label>Token:</label>
            <div class="token-box" id="tokenDisplay"></div>
            <button class="btn-primary" style="background: #ffc107; color: black;" onclick="renovarToken()">🔄 Renovar Token</button>
        </div>
    </div>

    <div id="modalEditRutina" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="cerrarModal('modalEditRutina')">&times;</span>
            <h3>Editar Rutina</h3>
            <input type="hidden" id="editRutinaId">
            <label>Nombre:</label> <input id="editRutinaNombre">
            <label>Descripción:</label> <input id="editRutinaDesc">
            <button class="btn-primary" onclick="guardarEdicionRutina()">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalEditEjercicio" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="cerrarModal('modalEditEjercicio')">&times;</span>
            <h3>Editar Ejercicio</h3>
            <input type="hidden" id="editEjercicioId">
            <label>Tipo de Ejercicio:</label>
            <select id="selectCatalogoEdit"></select>
            <label>Param 1 (Peso/Distancia):</label> <input type="number" id="editParam1">
            <label>Param 2 (Reps/Minutos):</label> <input type="number" id="editParam2">
            <button class="btn-primary" onclick="guardarEdicionEjercicio()">Guardar Cambios</button>
        </div>
    </div>

</div>

<script>
    const API = 'http://localhost:8080';
    let token = localStorage.getItem('token');
    
    // Estado
    let currentRutinaId = null;
    let currentSesionId = null;

    if (!token) window.location.href = 'index.html';

    // --- INICIO ---
    initApp();

    async function initApp() {
        await cargarPerfilHeader();
        await cargarCatalogoEnSelect('selectCatalogo');
        await cargarCatalogoEnSelect('selectCatalogoEdit');
        cargarRutinas();
    }

    // --- FUNCIONES DE PERFIL ---
    async function cargarPerfilHeader() {
        try {
            const res = await authFetch('/usuarios/perfil');
            const user = await res.json();
            document.getElementById('headerUsername').innerText = user.username;
            document.getElementById('profileUsername').value = user.username;
            document.getElementById('profileEmail').value = user.email;
            let admin = document.getElementById("btn-admin")
            if(user.rol === "ADMIN") admin.style.display = "";
            if(user.rol === "ADMIN") console.log("HGOL")
            else console.log("ADIOS")
        } catch (e) { console.error(e); }
    }
    function abrirPerfil() {
        document.getElementById('tokenDisplay').innerText = token;
        document.getElementById('modalPerfil').style.display = 'flex';
    }
    async function actualizarPerfil() {
        const body = { username: document.getElementById('profileUsername').value, email: document.getElementById('profileEmail').value };
        const res = await authFetch('/usuarios/perfil', 'PUT', body);
        if (res.ok) { alert("Perfil actualizado"); cargarPerfilHeader(); cerrarModal('modalPerfil'); }
        else { const err = await res.json(); alert("Error: " + JSON.stringify(err)); }
    }
    async function renovarToken() {
        try {
            const res = await fetch(API + '/auth/refresh-token', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
            if (res.ok) {
                const data = await res.json();
                token = data.token; localStorage.setItem('token', token);
                document.getElementById('tokenDisplay').innerText = token; alert("Token renovado.");
            } else { alert("Expirado."); logout(); }
        } catch (e) { alert("Error conexión"); }
    }

    // --- RUTINAS ---
    async function cargarRutinas() {
        const res = await authFetch('/rutinas');
        const data = await res.json();
        const div = document.getElementById('listaRutinas');
        div.innerHTML = '';
        
        data.forEach(r => {
            const safeNombre = r.nombre.replace(/'/g, "\\'");
            const safeDesc = (r.descripcion || '').replace(/'/g, "\\'");
            
            div.innerHTML += `
                <div class="card ${currentRutinaId === r.id ? 'active' : ''}" onclick="seleccionarRutina(${r.id}, this)">
                    <strong>${r.nombre}</strong><br>
                    <small>${r.descripcion || ''}</small>
                    <div class="btn-actions">
                        <button class="btn-mini btn-edit" onclick="abrirEditarRutina(${r.id}, '${safeNombre}', '${safeDesc}', event)">Editar</button>
                        <button class="btn-mini btn-delete" onclick="borrarRutina(${r.id}, event)">X</button>
                    </div>
                </div>
            `;
        });
    }

    function abrirEditarRutina(id, nombre, desc, e) {
        e.stopPropagation();
        document.getElementById('editRutinaId').value = id;
        document.getElementById('editRutinaNombre').value = nombre;
        document.getElementById('editRutinaDesc').value = desc;
        document.getElementById('modalEditRutina').style.display = 'flex';
    }

    async function guardarEdicionRutina() {
        const id = document.getElementById('editRutinaId').value;
        const body = {
            nombre: document.getElementById('editRutinaNombre').value,
            descripcion: document.getElementById('editRutinaDesc').value
        };
        const res = await authFetch(`/rutinas/${id}`, 'PUT', body);
        if (res.ok) {
            cerrarModal('modalEditRutina');
            cargarRutinas();
        } else {
            alert("Error al actualizar rutina");
        }
    }

    async function crearRutina() {
        const body = { nombre: document.getElementById('newRutinaNombre').value, descripcion: document.getElementById('newRutinaDesc').value };
        const res = await authFetch('/rutinas', 'POST', body);
        if(res.ok) { toggleForm('formRutina'); cargarRutinas(); }
        else { const err = await res.json(); alert("Error: " + JSON.stringify(err)); }
    }

    async function borrarRutina(id, e) {
        e.stopPropagation(); if(!confirm("¿Borrar rutina?")) return;
        await authFetch(`/rutinas/${id}`, 'DELETE');
        if(currentRutinaId === id) resetSesiones(); cargarRutinas();
    }

    function seleccionarRutina(id, element) {
        currentRutinaId = id;
        document.querySelectorAll('#listaRutinas .card').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('sesionesContent').style.display = 'block'; document.getElementById('sesionesMsg').style.display = 'none';
        resetEjercicios(); cargarSesiones(id);
    }

    // --- SESIONES ---
    async function cargarSesiones(rutinaId) {
        const res = await authFetch(`/rutinas/${rutinaId}/sesiones`);
        const data = await res.json();
        const div = document.getElementById('listaSesiones');
        div.innerHTML = '';
        data.forEach(s => {
            div.innerHTML += `
                <div class="card ${currentSesionId === s.id ? 'active' : ''}" onclick="seleccionarSesion(${s.id}, this)">
                    <strong>Sesión: ${s.fecha || 'Sin fecha'}</strong>
                    <div class="btn-actions">
                        <button class="btn-mini btn-delete" onclick="borrarSesion(${s.id}, event)">X</button>
                    </div>
                </div>
            `;
        });
    }
    async function crearSesion() {
        const body = { fecha: document.getElementById('newSesionFecha').value };
        await authFetch(`/rutinas/${currentRutinaId}/sesiones`, 'POST', body);
        toggleForm('formSesion'); cargarSesiones(currentRutinaId);
    }
    async function borrarSesion(id, e) {
        e.stopPropagation(); if(!confirm("¿Borrar sesión?")) return;
        await authFetch(`/sesiones/${id}`, 'DELETE');
        if(currentSesionId === id) resetEjercicios(); cargarSesiones(currentRutinaId);
    }
    function seleccionarSesion(id, element) {
        currentSesionId = id;
        document.querySelectorAll('#listaSesiones .card').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('ejerciciosContent').style.display = 'block'; document.getElementById('ejerciciosMsg').style.display = 'none';
        cargarEjercicios(id);
    }

    // --- EJERCICIOS ---
    async function cargarEjercicios(sesionId) {
        const res = await authFetch(`/sesiones/${sesionId}/ejercicios`);
        const data = await res.json();
        const div = document.getElementById('listaEjercicios');
        div.innerHTML = '';
        data.forEach(e => {
            div.innerHTML += `
                <div class="card">
                    <strong>${e.nombreEjercicio}</strong><br>
                    <span>Val 1: ${e.param1} | Val 2: ${e.param2}</span>
                    <div class="btn-actions">
                        <button class="btn-mini btn-edit" onclick="abrirEditarEjercicio(${e.id}, ${e.id}, ${e.param1}, ${e.param2}, event)">Editar</button>
                        <button class="btn-mini btn-delete" onclick="borrarEjercicio(${e.id}, event)">X</button>
                    </div>
                </div>
            `;
        });
    }

    function abrirEditarEjercicio(id, infoId, p1, p2, e) {
        if(e) e.stopPropagation();
        document.getElementById('editEjercicioId').value = id;
        document.getElementById('selectCatalogoEdit').value = infoId;
        document.getElementById('editParam1').value = p1;
        document.getElementById('editParam2').value = p2;
        document.getElementById('modalEditEjercicio').style.display = 'flex';
    }

    async function guardarEdicionEjercicio() {
        const id = document.getElementById('editEjercicioId').value;
        const body = {
            ejercicioInfoId: document.getElementById('selectCatalogoEdit').value,
            param1: document.getElementById('editParam1').value,
            param2: document.getElementById('editParam2').value
        };
        const res = await authFetch(`/ejercicios/${id}`, 'PUT', body);
        if (res.ok) {
            cerrarModal('modalEditEjercicio');
            cargarEjercicios(currentSesionId);
        } else {
            alert("Error al actualizar ejercicio");
        }
    }

    async function crearEjercicio() {
        const body = {
            ejercicioInfoId: document.getElementById('selectCatalogo').value,
            param1: document.getElementById('param1').value,
            param2: document.getElementById('param2').value
        };
        await authFetch(`/sesiones/${currentSesionId}/ejercicios`, 'POST', body);
        toggleForm('formEjercicio'); cargarEjercicios(currentSesionId);
    }
    async function borrarEjercicio(id, e) {
        if(e) e.stopPropagation();
        if(!confirm("¿Borrar ejercicio?")) return;
        await authFetch(`/ejercicios/${id}`, 'DELETE');
        cargarEjercicios(currentSesionId);
    }

    // --- UTILS ---
    async function cargarCatalogoEnSelect(selectId) {
        const res = await fetch(API + '/ejercicios-info');
        const data = await res.json();
        const select = document.getElementById(selectId);
        select.innerHTML = '';
        data.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.text = item.nombre;
            select.appendChild(opt);
        });
    }
    async function authFetch(endpoint, method = 'GET', body = null) {
        const options = { method: method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(API + endpoint, options);
        if (res.status === 403) { alert("Sesión expirada"); logout(); }
        return res;
    }
    function toggleForm(id) { const el = document.getElementById(id); el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    function resetSesiones() { currentRutinaId = null; document.getElementById('sesionesContent').style.display = 'none'; document.getElementById('sesionesMsg').style.display = 'block'; resetEjercicios(); }
    function resetEjercicios() { currentSesionId = null; document.getElementById('ejerciciosContent').style.display = 'none'; document.getElementById('ejerciciosMsg').style.display = 'block'; }
    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
</script>

</body>
</html>
