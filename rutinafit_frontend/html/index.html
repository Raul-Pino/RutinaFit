<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Gym App</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ddd; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .toggle { text-align: center; margin-top: 10px; color: #007bff; cursor: pointer; text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="formTitle">Iniciar Sesión</h2>
    
    <form id="authForm">
        <input type="text" id="username" placeholder="Usuario (solo registro)" class="hidden">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        
        <select id="rol" class="hidden">
            <option value="USER">Usuario</option>
            <option value="ADMIN">Administrador</option>
            <option value="ENTRENADOR">Entrenador</option>
        </select>

        <button type="submit" id="submitBtn">Entrar</button>
    </form>
    
    <div class="toggle" onclick="toggleMode()">¿No tienes cuenta? Regístrate</div>
    <div id="message" style="color: red; text-align: center; margin-top: 10px;"></div>
</div>

<script>
    let isRegister = false;
    const API_URL = 'https://localhost:8443/auth';

    function toggleMode() {
        isRegister = !isRegister;
        document.getElementById('formTitle').innerText = isRegister ? 'Registro' : 'Iniciar Sesión';
        document.getElementById('submitBtn').innerText = isRegister ? 'Registrarse' : 'Entrar';
        document.querySelector('.toggle').innerText = isRegister ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
        
        document.getElementById('username').classList.toggle('hidden');
        document.getElementById('rol').classList.toggle('hidden');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');

        const endpoint = isRegister ? '/register' : '/login';
        const body = { email, password };

        if (isRegister) {
            body.username = document.getElementById('username').value;
            body.rol = document.getElementById('rol').value;
        }

        try {
            const res = await fetch(API_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await res.json();

            if (!res.ok) throw new Error(data.error || 'Error en la petición');

            // Guardar token y decodificar rol
            localStorage.setItem('token', data.token);
            
            const payload = JSON.parse(atob(data.token.split('.')[1]));
            localStorage.setItem('rol', payload.rol);

            // Redireccionar según rol
            if (payload.rol === 'ADMIN') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'app.html';
            }

        } catch (err) {
            messageDiv.innerText = err.message;
        }
    });
</script>

</body>
</html>
