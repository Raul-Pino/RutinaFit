<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5" style="margin-top: -80px;">
  <div class="card tarjeta-oscura w-100 shadow-lg border-0" style="max-width: 450px; border-radius: 1rem; overflow: hidden;">
    <div class="barra-superior-modal"></div>
    <div class="card-body p-4 p-md-5 position-relative">
      <!-- Logo -->
      <button class="btn btn-verde mb-3" (click)="volver()">
        <i class="bi bi-arrow-left"></i> Inicio
      </button>

      <h4 class="fw-bold text-white mb-1" id="tituloModalRecuperar">Recuperar Contraseña</h4>
      <p class="modal-subtitulo mb-4 small opacity-75 text-white">Introduce los detalles en los campos de abajo para recuperar tu contraseña</p>

      <!-- Alerta de error recuperación -->
      @if (errorRecuperar()) {
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3" role="alert"
          style="background-color: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.4); border-radius: 0.5rem; color: #f66;">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span>{{ errorRecuperar() }}</span>
        </div>
      }

      <!-- Alerta de éxito recuperación -->
      @if (exitoRecuperar()) {
        <div class="alert d-flex align-items-center gap-2 py-2 px-3 mb-3" role="alert"
          style="background-color: rgba(118,255,3,0.12); border: 1px solid rgba(118,255,3,0.4); border-radius: 0.5rem; color: var(--verde-principal);">
          <i class="bi bi-check-circle-fill"></i>
          <span>{{ exitoRecuperar() }}</span>
        </div>
      }

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label text-white">Email</label>
        <input type="email" class="form-control campo-formulario" placeholder="nombre@ejemplo.com"
          [(ngModel)]="recuperarEmail" (keydown.enter)="recuperarContrasenaEnviar()">
      </div>

      <!-- Nueva Contraseña -->
      <div class="mb-3">
        <label class="form-label text-white">Nueva Contraseña</label>
        <div class="input-group">
          <input [type]="mostrarPassRecuperar ? 'text' : 'password'" class="form-control campo-formulario"
            placeholder="••••••••" [(ngModel)]="recuperarContrasena" (keydown.enter)="recuperarContrasenaEnviar()">
          <button class="btn boton-toggle-ojo" type="button" (click)="mostrarPassRecuperar = !mostrarPassRecuperar">
            <i class="bi" [ngClass]="mostrarPassRecuperar ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Repetir contraseña -->
      <div class="mb-3">
        <label class="form-label text-white">Repita la Contraseña</label>
        <div class="input-group">
          <input type="password" class="form-control campo-formulario"
            placeholder="••••••••" [(ngModel)]="recuperarContrasenaConf" (keydown.enter)="recuperarContrasenaEnviar()">
        </div>
      </div>

      <!-- Botón recuperar -->
      <button class="btn btn-verde w-100 py-2 fw-bold" (click)="recuperarContrasenaEnviar()">Recuperar Contraseña</button>

      <p class="text-center mt-3 mb-0 modal-pie text-white">
        ¿Ya tienes una cuenta?&nbsp;
        <a class="enlace-verde" routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
