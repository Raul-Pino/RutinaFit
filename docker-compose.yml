version: '3.8'

services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_DB: ${DB_NAME:-rutinafit_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-rutinafit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  back:
    build: ./rutinafit_backend
    container_name: Back
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-rutinafit_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      URL_FRONT: ${URL_FRONT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  front:
    build: ./rutinafit_frontend
    container_name: Front
    ports:
      - "4200:80"
    depends_on:
      - back
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
